{% extends "admin/base.html" %}
{% load static %}

{% block title %}{{ title }} | Sarojini Welder Portal{% endblock %}

{% block extrahead %}
{{ block.super }}
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="stylesheet" href="{% static 'css/admin_mobile_custom.css' %}">
<script src="{% static 'js/admin_mobile_preview.js' %}" defer></script>
{% endblock %}

{% block branding %}
<div id="site-name">
    <a href="{% url 'admin:index' %}" style="display: inline-flex; align-items: center; gap: 10px; text-decoration: none;">
        <span style="display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 8px; background: linear-gradient(135deg, #f59e0b, #d97706); color: #020617; font-weight: 900; font-size: 16px; box-shadow: 0 0 12px rgba(245, 158, 11, 0.4);">⚡</span>
        <span style="font-weight: 800; font-size: 17px; letter-spacing: 0.05em; color: #f8fafc;">Sarojini Steel Works</span>
        <span style="font-size: 10px; background: rgba(245, 158, 11, 0.15); border: 1px solid rgba(245, 158, 11, 0.35); color: #fbbf24; padding: 2px 7px; border-radius: 9999px; text-transform: uppercase; font-weight: 700; letter-spacing: 0.05em;">Mobile Admin</span>
    </a>
</div>
{% endblock %}

{% block nav-global %}{% endblock %}
